language: CSDL
version: "0.1"
kind: accessibility-proof-source
id: proof-07-normalized-map
scenario: normalized-map
source_reference:
  kind: analytical-package
  path: analytics/analytical-mode-v0.1/proofs/packages/07-map.yaml
profiles: [light, night, monochrome]
text_elements:
  - {id: title, role: display, foreground: ink.primary, background: background.base}
  - {id: region-labels, role: label, foreground: ink.primary, background: background.base}
  - {id: units, role: unit, foreground: ink.secondary, background: background.base}
  - {id: source, role: source, foreground: ink.secondary, background: background.base}
graphical_objects:
  - {id: region-boundaries, role: region, component: Field, foreground: line.strong, background: background.base, stroke_px: 2, meaningful: true}
  - {id: selected-region, role: signal, component: Node, foreground: signal.data, background: background.base, stroke_px: 2, meaningful: true}
  - {id: missing-region, role: selection, component: Node, foreground: data.missing, background: background.base, stroke_px: 2, meaningful: true}
semantic_encodings:
  - meaning: data
    color_token: signal.data
    redundant_carriers: [pattern, direct_label]
    normalized_rate: true
    denominator: runs
    unit: per_100000_runs
    patterns: [horizontal_hatch, vertical_hatch, cross_hatch]
    missing_label: N/A
    missing_pattern: open_frame
    target: normalized-regions
output: {canvas: 1920x1080, orientation: landscape, colorspace: sRGB, format: deterministic-specification}
