language: CSDL
version: "0.1"
kind: accessibility-proof-source
id: proof-09-monochrome-export
scenario: monochrome-export
source_reference:
  kind: generation-package
  path: recipes/recipe-library-v0.5/proofs/packages/02-structural.yaml
profiles: [monochrome]
text_elements:
  - {id: title, role: display, foreground: ink.primary, background: background.base}
  - {id: state-labels, role: label, foreground: ink.primary, background: background.base}
  - {id: source, role: source, foreground: ink.secondary, background: background.base}
graphical_objects:
  - {id: signal, role: signal, component: Node, foreground: signal.primary, background: background.base, stroke_px: 2, meaningful: true}
  - {id: focus, role: focus, component: Node, foreground: state.focus, background: background.base, stroke_px: 2, meaningful: true}
  - {id: selection, role: selection, component: Node, foreground: state.selection, background: background.base, stroke_px: 2, meaningful: true}
  - {id: error, role: node, component: Node, foreground: signal.error, background: background.base, stroke_px: 2, meaningful: true}
  - {id: positive, role: node, component: Node, foreground: signal.positive, background: background.base, stroke_px: 2, meaningful: true}
  - {id: attention, role: node, component: Node, foreground: signal.attention, background: background.base, stroke_px: 2, meaningful: true}
  - {id: data, role: node, component: Node, foreground: signal.data, background: background.base, stroke_px: 2, meaningful: true}
  - {id: missing, role: node, component: Node, foreground: data.missing, background: background.base, stroke_px: 2, meaningful: true}
semantic_encodings:
  - {meaning: signal, color_token: signal.primary, redundant_carriers: [shape, stroke_weight, direct_label], grayscale_contrast: 9.0, target: signal-state}
  - {meaning: focus, color_token: state.focus, redundant_carriers: [boundary, stroke_weight], target: focus-state}
  - {meaning: selection, color_token: state.selection, redundant_carriers: [boundary, direct_label], target: selection-state}
  - {meaning: error, color_token: signal.error, redundant_carriers: [pattern, status_text], pattern: diagonal_hatch, target: error-state}
  - {meaning: positive, color_token: signal.positive, redundant_carriers: [pattern, status_text], pattern: horizontal_hatch, target: positive-state}
  - {meaning: attention, color_token: signal.attention, redundant_carriers: [pattern, status_text], pattern: cross_hatch, target: attention-state}
  - {meaning: data, color_token: signal.data, redundant_carriers: [shape, direct_label], target: data-state}
  - {meaning: missing, color_token: data.missing, redundant_carriers: [missing_label, boundary], missing_label: N/A, target: missing-state}
  - {meaning: uncertainty, color_token: signal.attention, redundant_carriers: [interval_boundary, direct_label], target: uncertainty-state}
  - {meaning: observed, color_token: signal.data, redundant_carriers: [line_style, direct_label], line_style: solid, target: observed-state}
  - {meaning: forecast, color_token: signal.data, redundant_carriers: [line_style, direct_label], line_style: dashed, target: forecast-state}
output: {canvas: 1920x1080, orientation: landscape, colorspace: sRGB, format: deterministic-specification}
