      attribution: "AGENTIC DISCIPLINE"
    hard_exclusions: *hard_exclusions
    prompt: prompts/03-quote.yaml
    specification: specs/03-quote.md
    evidence: {mode: generated, candidate_generation_required: true, canonical_example: canonical/light/16x9/03-quote.png}
    acceptance: *acceptance

