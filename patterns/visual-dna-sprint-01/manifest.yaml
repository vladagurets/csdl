catalog:
  id: visual-dna-sprint-01
  title: "CSDL Visual DNA Sprint 1"
  version: 0.1.0
  canvas: 1920x1080
  orientation: landscape
  style_anchor: pilots/01-agentic-discipline/references/style-anchor-light.png
  visual_authority: visual-authority.yaml
  family_count: 20
  canonical_distribution: {A: 13, B: 6, C: 1}
  language: uk
  terminology_language: en
  analytical_scope: "Visual DNA prototypes only; full quantitative rules remain deferred to Milestone 5"

defaults:
  typography: &typography
    display: modular_technical
    body: neutral_sans
    code: technical_mono
    all_text_horizontal: true
    max_typographic_tricks: 1
  spacing: &spacing
    outer_margin_horizontal: 96
    outer_margin_vertical: 72
    baseline_unit: 8
    major_gap_tokens: [space.6, space.7, space.8]
  hard_exclusions: &hard_exclusions
    - extra text
    - logos or repeated footers
    - UI chrome or decorative card shells
    - decorative coordinates or random dot fields
    - gradients, shadows, glossy surfaces, or 3D
    - political, Soviet, or revolutionary-poster styling
    - pixel, bitmap, dot-matrix, segmented, or retro-computer lettering
  acceptance: &acceptance
    exact_content: true
    clarity: 5
    presentation_readability: 5
    semantic_integrity: 4
    candidate_count: 3
    minimum_each_score: 4
    minimum_average: 4.4

families:
  - id: "01"
    slug: hero
    name: Hero
    wave: pilot
    problem: "Make one proposition immediately understandable and memorable."
    scenarios: [opening thesis, section thesis, key takeaway]
    components: [Anchor, Signal]
    assembly_order: [place Anchor, isolate supporting copy, add one semantic Signal]
    allowed_levels: [A, B, C]
    canonical_level: A
    typography: *typography
    spacing: *spacing
    signal: {color: coral, role: stable counterweight, max_area_percent: 8}
    density: low
    content:
      headline: "СИЛЬНИЙ АГЕНТ ≠ СТІЙКИЙ РЕЗУЛЬТАТ"
      supporting_copy: "Стабільність з’являється, коли робота має процес, перевірки й пам’ять."
    hard_exclusions: *hard_exclusions
    prompt: prompts/01-hero.yaml
    specification: specs/01-hero.md
    evidence:
      mode: pilot_reference
      candidate_generation_required: false
      canonical_example: pilots/01-agentic-discipline/canonical/light/16x9/01-hook.png
      source_prompt: pilots/01-agentic-discipline/prompts/01-hook.yaml
      source_review: pilots/01-agentic-discipline/evaluation/review.md
      source_scores: pilots/01-agentic-discipline/evaluation/scores.csv
      sha256: 39de00d730e534c942fbb96e6fe5cf932e7e14c0a89926877406ba3cade62d8c
    acceptance: *acceptance

  - id: "02"
    slug: cover
    name: Cover
    wave: editorial
    problem: "Name a series or section and establish its single visual premise."
    scenarios: [series opening, chapter divider]
    components: [Anchor, Signal, Field]
    assembly_order: [place short title Anchor, establish one open Field, add one Signal plane]
    allowed_levels: [A, C]
    canonical_level: C
    typography: *typography
    spacing: *spacing
    signal: {color: coral, role: opening plane, max_area_percent: 22}
    density: low
    content:
      headline: "СИСТЕМИ, ЩО ВЧАТЬСЯ"
      supporting_copy: "VISUAL DNA SPRINT 1"
    hard_exclusions: *hard_exclusions
    prompt: prompts/02-cover.yaml
    specification: specs/02-cover.md
    evidence: {mode: generated, candidate_generation_required: true, canonical_example: canonical/light/16x9/02-cover.png}
    acceptance: *acceptance

  - id: "03"
    slug: quote
    name: Quote
    wave: editorial
    problem: "Give one exact statement enough space and hierarchy to be read as an idea, not decoration."
    scenarios: [principle, testimony, chapter pause]
    components: [Anchor, Signal]
