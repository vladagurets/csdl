library:
  id: component-library-v0.1
  title: "CSDL Component Library v0.1"
  version: 0.1.0
  source_milestone: 3
  canvas: 1920x1080
  orientation: landscape
  markdown_authority: true
  component_count: 15
  schema: schema.yaml
  index: index.yaml
  compatibility: compatibility.yaml
  proofs_dir: proofs
  evaluation: evaluation/review.md
  visual_authority: patterns/visual-dna-sprint-01/visual-authority.yaml

vocabulary:
  components:
    - Anchor
    - Signal
    - Field
    - Frame
    - Cluster
    - Vector
    - Divider
    - Node
    - Loop
    - Collision
    - Bridge
    - Axis
    - Pulse
    - Label
    - Legend
  relations:
    - inside
    - contains
    - attached_to
    - connected_to
    - directs
    - separates
    - orders
    - overlaps
    - produces
    - groups
    - maps_to
    - highlights
    - bounds
    - repeats

components:
  - id: "01"
    slug: anchor
    name: Anchor
    category: semantic
    purpose: "Carry the composition's dominant proposition or central concept."
    semantic_meaning: "The first semantic read and ownership root for subordinate content."
    spatial_contract:
      count: {min: 1, max: 2}
      default_count: 1
      ownership: "One Anchor owns the primary idea; two are permitted only for evidenced peer comparison or collision."
      negative_space_percent: {min: 45, max: 75}
    dimensions:
      unit: px
      width: {min: 122, max: 1274}
      height: {min: 44, max: 936}
      area_percent: {min: 1, max: 35}
    relations:
      allowed:
        - {type: inside, target: Field, direction: outbound, cardinality: zero_or_one}
        - {type: attached_to, target: Label, direction: inbound, cardinality: zero_or_many}
        - {type: highlights, target: Signal, direction: inbound, cardinality: zero_or_one}
        - {type: overlaps, target: Collision, direction: outbound, cardinality: zero_or_one, condition: "Only when the intersection is the declared visual mechanism."}
      forbidden:
        - {type: maps_to, target: Legend, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: repeats, target: Loop, direction: outbound, cardinality: zero_or_many, condition: always}
    compatible_families: [hero, cover, quote, big-number, comparison, collision, hierarchy, framework]
    expression_limits:
      A: {status: allowed, max_count: 2, max_area_percent: 18}
      B: {status: allowed, max_count: 2, max_area_percent: 28}
      C: {status: conditional, max_count: 2, max_area_percent: 35, condition: "Copy stays short and the Anchor remains one proposition or one peer-force pair."}
    typography:
      role: display
      constraints: [modular_technical, all_text_horizontal, max_one_typographic_trick]
    semantic_color:
      default: ink.primary
      signal_target_allowed: true
      constraints: ["Color cannot create a second semantic owner."]
    examples:
      do:
        - {description: "Use one proposition as the first read and terminate its route at one Signal.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
      dont:
        - {description: "Do not treat a large decorative plane or a second unsupported headline as an Anchor.", evidence: patterns/visual-dna-sprint-01/specs/01-hero.md}
    prompt_dsl:
      syntax: "Anchor(id=<id>, role=<primary|peer>, content=<copy-ref>)"
      required_fields: [id, role]
      optional_fields: [content, weight, span]
    validation_invariants:
      - "At least one Anchor owns the main idea in every compatible editorial composition."
      - "Two Anchors require peer comparison or collision semantics."
      - "Visual scale alone never establishes Anchor status."
    evidence:
      - {path: specs/2026-07-17-csdl-v0.1-design.md, locator: "10.1 Nouns / Anchor", supports: "Foundation semantic meaning and one-idea ownership."}
      - {path: patterns/visual-dna-sprint-01/specs/01-hero.md, locator: "Semantic components", supports: "One Anchor carries the proposition."}
      - {path: patterns/visual-dna-sprint-01/evaluation/review.md, locator: "01 Hero — Pilot reference accepted", supports: "Accepted Anchor to Signal reading route."}
    specification: specs/01-anchor.md
    evidence_level: strong

  - id: "02"
    slug: signal
    name: Signal
    category: semantic
    purpose: "Identify the one state, result, transition, value, path, or boundary needing immediate attention."
    semantic_meaning: "A dominant emphasis role attached to another component; never free decoration or a color synonym."
    spatial_contract:
      count: {min: 0, max: 1}
      target_required: true
      rendering: [intrinsic_component_state, attached_marker, semantic_plane]
      one_dominant_signal: true
    dimensions:
      unit: percent
      width: {min: 0.1, max: 100}
      height: {min: 0.1, max: 100}
      area_percent: {min: 0.04, max: 25}
    relations:
      allowed:
        - {type: highlights, target: any, direction: outbound, cardinality: one}
        - {type: attached_to, target: any, direction: outbound, cardinality: one}
        - {type: inside, target: Field, direction: outbound, cardinality: zero_or_one}
        - {type: produces, target: Collision, direction: inbound, cardinality: zero_or_one}
        - {type: maps_to, target: Legend, direction: inbound, cardinality: zero_or_one, condition: "Only for a validated multi-category analytical mapping."}
      forbidden:
        - {type: groups, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: orders, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
    compatible_families: [hero, cover, quote, big-number, comparison, collision, before-after, timeline, matrix, workflow, loop, pipeline, decision-tree, framework, kpi, table, chart, dashboard]
    expression_limits:
      A: {status: allowed, max_count: 1, max_area_percent: 8}
      B: {status: allowed, max_count: 1, max_area_percent: 12}
      C: {status: allowed, max_count: 1, max_area_percent: 25}
    typography:
      role: annotation_or_target_state
      constraints: [neutral_label_unless_label_is_signal, all_text_horizontal, no_duplicate_color_emphasis]
    semantic_color:
      default: signal.primary
      signal_target_allowed: true
      constraints: [semantic_palette_only, one_dominant_color, form_or_label_also_carries_meaning]
    examples:
      do:
        - {description: "Highlight VERIFY through one solid Node while keeping its Label neutral.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
      dont:
        - {description: "Do not color both a Node and its Label as separate competing signals.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
    prompt_dsl:
      syntax: "Signal(id=<id>, target=<instance-id>, role=<semantic-role>)"
      required_fields: [id, target, role]
      optional_fields: [color, area_percent, rendering]
    validation_invariants:
      - "A Signal has exactly one semantic target."
      - "A composition has at most one dominant Signal role."
      - "Area percentage stays inside the expression-level ceiling."
      - "Color is never the only carrier of meaning."
    evidence:
      - {path: DECISIONS.md, locator: "D-010 and D-013", supports: "One dominant semantic signal per normal screen."}
      - {path: specs/2026-07-17-csdl-v0.1-design.md, locator: "9.3 Color rules", supports: "Expression-specific signal-area limits and semantic color."}
      - {path: patterns/visual-dna-sprint-01/evaluation/review.md, locator: "08 Timeline — regenerated example accepted", supports: "One solid active Node and neutral Label; duplicate emphasis rejected."}
    specification: specs/02-signal.md
    evidence_level: strong

  - id: "03"
    slug: field
    name: Field
    category: spatial
    purpose: "Establish context, environment, or state scope without defaulting to a closed panel."
    semantic_meaning: "The space in which components share context or state."
    spatial_contract:
      count: {min: 0, max: 2}
      openness: [implicit, open_boundary, restrained_plane]
      context_required: true
      decorative_panel: false
    dimensions:
      unit: px
      width: {min: 244, max: 1728}
      height: {min: 144, max: 936}
      area_percent: {min: 12, max: 90}
    relations:
      allowed:
        - {type: contains, target: Anchor, direction: outbound, cardinality: zero_or_many}
        - {type: contains, target: Node, direction: outbound, cardinality: zero_or_many}
        - {type: contains, target: Cluster, direction: outbound, cardinality: zero_or_many}
        - {type: contains, target: Frame, direction: outbound, cardinality: zero_or_many}
        - {type: separates, target: Divider, direction: inbound, cardinality: zero_or_one}
        - {type: bounds, target: Node, direction: outbound, cardinality: zero_or_many}
      forbidden:
        - {type: directs, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: maps_to, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
    compatible_families: [cover, comparison, before-after, matrix, architecture]
    expression_limits:
      A: {status: allowed, max_count: 2, min_negative_space_percent: 60}
      B: {status: allowed, max_count: 2, min_negative_space_percent: 45}
      C: {status: conditional, max_count: 1, condition: "Only one large scope field supports a short culmination or cover."}
    typography:
      role: none
      constraints: [Labels_name_scope, body_copy_does_not_define_boundary]
    semantic_color:
      default: paper.base
      signal_target_allowed: true
      constraints: [open_or_low_chroma_by_default, never_generic_card_fill]
    examples:
      do:
        - {description: "Use one open system Field to place USER outside and AGENT, TOOLS, and MEMORY inside.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
      dont:
        - {description: "Do not turn every content group into a closed background card.", evidence: patterns/visual-dna-sprint-01/specs/11-architecture.md}
    prompt_dsl:
      syntax: "Field(id=<id>, role=<context|state|coordinate>)"
      required_fields: [id, role]
      optional_fields: [boundary, signal_state, openness]
    validation_invariants:
      - "Every Field has a declared context or state role."
      - "A Field never exists solely to decorate a background."
      - "Two Fields require peer comparison or before/after state semantics."
    evidence:
      - {path: specs/2026-07-17-csdl-v0.1-design.md, locator: "10.1 Nouns / Field", supports: "Field means context or environment."}
      - {path: patterns/visual-dna-sprint-01/specs/11-architecture.md, locator: "Semantic components", supports: "One Field defines stable system scope."}
      - {path: patterns/visual-dna-sprint-01/evaluation/review.md, locator: "09 Matrix and 11 Architecture", supports: "Open coordinate and system Fields in accepted evidence."}
    specification: specs/03-field.md
    evidence_level: strong

  - id: "04"
    slug: frame
    name: Frame
    category: structural
    purpose: "Create a functional boundary for scope, lookup, or nested ownership depth."
    semantic_meaning: "A visible or implied boundary whose edge improves interpretation."
    spatial_contract:
      count: {min: 0, max: 4}
      openness: [open, sparse_rules, closed_when_semantically_required]
      nesting_depth: {min: 0, max: 4}
      decorative_shell: false
    dimensions:
      unit: px
      width: {min: 122, max: 1728}
      height: {min: 64, max: 936}
      area_percent: {min: 1, max: 80}
    relations:
      allowed:
        - {type: contains, target: Node, direction: outbound, cardinality: zero_or_many}
        - {type: contains, target: Axis, direction: outbound, cardinality: zero_or_many}
        - {type: contains, target: Label, direction: outbound, cardinality: zero_or_many}
        - {type: contains, target: Frame, direction: outbound, cardinality: zero_or_many, condition: "Only for explicit nested ownership depth."}
        - {type: inside, target: Field, direction: outbound, cardinality: zero_or_one}
        - {type: bounds, target: any, direction: outbound, cardinality: one_or_many}
      forbidden:
        - {type: directs, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: repeats, target: Loop, direction: outbound, cardinality: zero_or_many, condition: always}
    compatible_families: [hierarchy, table]
    expression_limits:
      A: {status: allowed, max_count: 4, max_nesting_depth: 4}
      B: {status: allowed, max_count: 4, max_nesting_depth: 4}
      C: {status: forbidden, max_count: 0, reason: "Repeated functional boundaries conflict with the short single-peak Signal contract."}
    typography:
      role: none
      constraints: [Labels_remain_direct, Frame_never_substitutes_for_text_hierarchy]
    semantic_color:
      default: neutral.line
      signal_target_allowed: true
      constraints: [sparse_rules_by_default, signal_color_marks_scope_only_when_semantic]
    examples:
      do:
        - {description: "Use nested open Frames to express OBJECTIVE to CHECK ownership depth.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
        - {description: "Use sparse rules as one open Table lookup Frame.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
      dont:
        - {description: "Do not wrap every Node in a decorative card shell.", evidence: patterns/visual-dna-sprint-01/specs/18-table.md}
    prompt_dsl:
      syntax: "Frame(id=<id>, scope=<scope-ref>)"
      required_fields: [id, scope]
      optional_fields: [openness, nesting_depth, boundary_style, signal_state]
    validation_invariants:
      - "Every Frame boundary changes scope, lookup, or ownership interpretation."
      - "Nested Frames preserve one unambiguous ownership path."
      - "A Frame cannot be justified by visual grouping alone."
    evidence:
      - {path: specs/2026-07-17-csdl-v0.1-design.md, locator: "10.1 Nouns / Frame and D-029 implementation note", supports: "Functional analytical and ownership boundary."}
      - {path: patterns/visual-dna-sprint-01/specs/10-hierarchy.md, locator: "Semantic components", supports: "Nested open Frames express ownership depth."}
      - {path: patterns/visual-dna-sprint-01/evaluation/review.md, locator: "18 Table — generated example accepted", supports: "Sparse open lookup Frame without cell chrome."}
    specification: specs/04-frame.md
    evidence_level: bounded

  - id: "05"
    slug: cluster
    name: Cluster
    category: structural
    purpose: "Group related concepts, evidence, or measures without automatically implying order."
    semantic_meaning: "A set whose members share one role, model, or review context."
    spatial_contract:
      count: {min: 0, max: 1}
      member_count: {min: 2, max: 6}
      grouping_cues: [proximity, alignment, repetition]
      enclosure_required: false
      sequence_implied: false
    dimensions:
      unit: px
      width: {min: 244, max: 1472}
      height: {min: 64, max: 720}
      area_percent: {min: 2, max: 40}
    relations:
      allowed:
        - {type: groups, target: Node, direction: outbound, cardinality: one_or_many}
        - {type: groups, target: Label, direction: outbound, cardinality: one_or_many}
        - {type: groups, target: Pulse, direction: outbound, cardinality: zero_or_many}
        - {type: inside, target: Field, direction: outbound, cardinality: zero_or_one}
        - {type: inside, target: Frame, direction: outbound, cardinality: zero_or_one}
        - {type: highlights, target: Signal, direction: inbound, cardinality: zero_or_one}
      forbidden:
        - {type: orders, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: directs, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: repeats, target: Loop, direction: outbound, cardinality: zero_or_many, condition: always}
    compatible_families: [framework, dashboard]
    expression_limits:
      A: {status: allowed, max_count: 1, max_members: 4}
      B: {status: allowed, max_count: 1, max_members: 6}
      C: {status: forbidden, max_count: 0, reason: "Multiple peer members conflict with the short single-peak Signal contract."}
    typography:
      role: label
      constraints: [equal_member_roles, direct_labels, no_card_titles]
    semantic_color:
      default: ink.primary
      signal_target_allowed: true
      constraints: [members_neutral_by_default, at_most_one_member_carries_signal]
    examples:
      do:
        - {description: "Use four equal open Nodes as one non-sequential Framework Cluster.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
        - {description: "Use an aligned three-measure Cluster subordinate to one Dashboard Pulse.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
      dont:
        - {description: "Do not turn equal members into cards, steps, or a decorative network.", evidence: patterns/visual-dna-sprint-01/specs/16-framework.md}
    prompt_dsl:
      syntax: "Cluster(id=<id>, members=<instance-ids>, role=<group-role>)"
      required_fields: [id, members, role]
      optional_fields: [alignment, equality, signal_member]
    validation_invariants:
      - "A Cluster contains two to six semantically related members."
      - "Member order is not interpreted as chronology unless an Axis is separately declared."
      - "Only one member may carry the dominant Signal."
      - "Alignment and proximity replace decorative enclosure."
    evidence:
      - {path: specs/2026-07-17-csdl-v0.1-design.md, locator: "10.1 Nouns / Cluster", supports: "Group of related concepts or evidence."}
      - {path: patterns/visual-dna-sprint-01/specs/16-framework.md, locator: "Semantic components", supports: "Equal concept Nodes form one non-sequential Cluster."}
      - {path: patterns/visual-dna-sprint-01/evaluation/review.md, locator: "16 Framework and 20 Dashboard", supports: "Accepted peer-concept and supporting-metric grouping."}
    specification: specs/05-cluster.md
    evidence_level: strong

  - id: "07"
    slug: divider
    name: Divider
    category: structural
    purpose: "Separate peer states, positions, or scopes without establishing scale, direction, or moral priority."
    semantic_meaning: "A subordinate distinction boundary between comparable regions."
    spatial_contract:
      count: {min: 0, max: 1}
      subjects_required: 2
      thickness_px: {min: 1, max: 4}
      dominance: subordinate
    dimensions:
      unit: px
      width: {min: 1, max: 1728}
      height: {min: 1, max: 936}
      area_percent: {min: 0.01, max: 2}
    relations:
      allowed:
        - {type: separates, target: Field, direction: outbound, cardinality: one_or_many}
        - {type: separates, target: Anchor, direction: outbound, cardinality: one_or_many}
        - {type: separates, target: Frame, direction: outbound, cardinality: one_or_many}
      forbidden:
        - {type: orders, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: directs, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: connected_to, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
    compatible_families: [comparison, before-after]
    expression_limits:
      A: {status: allowed, max_count: 1, max_area_percent: 2}
      B: {status: allowed, max_count: 1, max_area_percent: 2}
      C: {status: conditional, max_count: 1, condition: "Only when peer distinction remains essential and readable inside the single Signal peak."}
    typography:
      role: none
      constraints: [Labels_belong_to_separated_subjects, no_text_on_Divider]
    semantic_color:
      default: neutral.line
      signal_target_allowed: false
      constraints: [subordinate_tone, no_decorative_split_plane]
    examples:
      do:
        - {description: "Use one thin Divider between two equal Comparison Fields.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
      dont:
        - {description: "Do not use a Divider as an Axis, Vector, decorative split screen, or unequal moral boundary.", evidence: patterns/visual-dna-sprint-01/specs/05-comparison.md}
    prompt_dsl:
      syntax: "Divider(id=<id>, subjects=<instance-ids>)"
      required_fields: [id, subjects]
      optional_fields: [orientation, tone, gap]
    validation_invariants:
      - "A Divider separates exactly two peer scopes or states."
      - "A Divider never establishes order, direction, or quantitative scale."
      - "Thickness remains subordinate and area stays below two percent."
    evidence:
      - {path: specs/2026-07-17-csdl-v0.1-design.md, locator: "10.4 Structural components / Divider", supports: "Divider separates areas or positions."}
      - {path: patterns/visual-dna-sprint-01/specs/05-comparison.md, locator: "Semantic components", supports: "One Divider preserves peer distinction."}
      - {path: patterns/visual-dna-sprint-01/evaluation/review.md, locator: "05 Comparison and 07 Before / After", supports: "Accepted thin subordinate separation."}
    specification: specs/07-divider.md
    evidence_level: strong

  - id: "08"
    slug: node
    name: Node
    category: structural
    purpose: "Represent one stage, actor, option, concept, gate, or data point."
    semantic_meaning: "One discrete semantic unit participating in a larger relation or set."
    spatial_contract:
      count: {min: 0, max: 7}
      identity_required: true
      renderings: [bare, open, solid, bounded]
      repeated_semantics_comparable: true
    dimensions:
      unit: px
      width: {min: 8, max: 488}
      height: {min: 8, max: 240}
      area_percent: {min: 0.02, max: 12}
    relations:
      allowed:
        - {type: inside, target: Field, direction: outbound, cardinality: zero_or_one}
        - {type: inside, target: Frame, direction: outbound, cardinality: zero_or_one}
        - {type: groups, target: Cluster, direction: inbound, cardinality: zero_or_one}
        - {type: connected_to, target: Bridge, direction: inbound, cardinality: zero_or_many}
        - {type: directs, target: Vector, direction: inbound, cardinality: zero_or_many}
        - {type: orders, target: Axis, direction: inbound, cardinality: zero_or_one}
        - {type: repeats, target: Loop, direction: inbound, cardinality: zero_or_one}
        - {type: attached_to, target: Label, direction: inbound, cardinality: zero_or_one}
        - {type: highlights, target: Signal, direction: inbound, cardinality: zero_or_one}
        - {type: maps_to, target: Legend, direction: inbound, cardinality: zero_or_one, condition: "Only for a validated multi-category analytical mapping."}
      forbidden:
        - {type: contains, target: Field, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: separates, target: Divider, direction: outbound, cardinality: zero_or_many, condition: always}
        - {type: bounds, target: any, direction: outbound, cardinality: zero_or_many, condition: always}
    compatible_families: [timeline, matrix, hierarchy, architecture, workflow, loop, pipeline, decision-tree, framework, chart]
    expression_limits:
      A: {status: allowed, max_count: 7}
      B: {status: allowed, max_count: 6}
      C: {status: conditional, max_count: 4, condition: "Only a short culmination with directly readable Nodes and one Signal."}
    typography:
      role: label
      constraints: [direct_identity, comparable_repeated_roles, no_UI_pills]
    semantic_color:
      default: ink.primary
      signal_target_allowed: true
      constraints: [neutral_by_default, one_selected_Node_maximum]
    examples:
      do:
        - {description: "Use five bare ordered Nodes on one Timeline Axis and select VERIFY once.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
        - {description: "Use four square directly labeled Matrix Nodes at deliberate relative positions.", evidence: patterns/visual-dna-sprint-01/evaluation/review.md}
      dont:
        - {description: "Do not turn Nodes into UI pills, repeated cards, icons, or unlabeled decorative points.", evidence: patterns/visual-dna-sprint-01/specs/13-loop.md}
    prompt_dsl:
      syntax: "Node(id=<id>, role=<stage|actor|option|concept|gate|data-point>)"
      required_fields: [id, role]
      optional_fields: [content, state, value, unit, period]
    validation_invariants:
      - "Every Node has one identifiable semantic role."
      - "Repeated Nodes represent comparable units."
      - "At most one Node carries the dominant Signal unless a later analytical contract explicitly proves multiple categories."
      - "A Node does not become a card shell or interface control."
    evidence:
      - {path: specs/2026-07-17-csdl-v0.1-design.md, locator: "10.1 Nouns / Node", supports: "Node represents a stage, actor, or data point."}
      - {path: patterns/visual-dna-sprint-01/specs/08-timeline.md, locator: "Semantic components", supports: "Ordered directly labeled stages."}
      - {path: patterns/visual-dna-sprint-01/evaluation/review.md, locator: "08 Timeline through 20 Dashboard", supports: "Accepted bare/open/solid/data Node behavior and UI rejections."}
    specification: specs/08-node.md
    evidence_level: strong

  - id: "12"
    slug: axis
    name: Axis
    category: structural
    purpose: "Establish ordered progression, continuous comparison, lookup alignment, support alignment, or quantitative domain."
    semantic_meaning: "An open reference structure that makes order, dimension, lookup, or scale explicit."
    spatial_contract:
      count: {min: 0, max: 2}
      modes: [sequence, coordinate, lookup, support, quantitative]
      direction_required: true
      quantitative_domain_required_for: quantitative
      closure: open
    dimensions:
      unit: px
      width: {min: 122, max: 1728}
      height: {min: 1, max: 864}
      area_percent: {min: 0.05, max: 15}
    relations:
      allowed:
        - {type: orders, target: Node, direction: outbound, cardinality: one_or_many}
        - {type: orders, target: Label, direction: outbound, cardinality: one_or_many}
        - {type: orders, target: Pulse, direction: outbound, cardinality: zero_or_many}
