language: CSDL
version: 0.1
use_case: infographic-diagram
mode:
  name: Quiet Modular
  palette: Muted Signal Light
  canvas: 1920x1080
  orientation: landscape
  expression_default: A
visual_direction:
  background: "warm paper, #F7F5F0"
  primary_ink: "warm graphite, #1B1B19"
  secondary_ink: "soft graphite, #535457"
  primary_signal: "muted mineral coral, #C96157"
  geometry: "flat, precise, semantic, no decorative 3D"
  negative_space: "60–75 percent depending on level"
  asymmetry: "controlled and grid-aware"
  texture: "very subtle paper grain only; no distressed print"
typography:
  display: "Ukrainian-capable Inter Display family, heavy but restrained"
  body: "Inter-style neutral highly legible sans-serif"
  code: "clean technical monospace"
  rules:
    - "render complete Unicode words"
    - "preserve Ukrainian letters and diacritics exactly"
    - "all text remains horizontal"
    - "no more than one typographic trick"
composition:
  grid: "12 columns, 96 px outer margins, 24 px gutters"
  headline_span: "left 6 columns"
  mechanism_zone: "right 4 columns"
  reading_path: "left to right"
  footer: none
  repeated_logo: false
calibration_copy:
  headline: "ТИХА МОДУЛЬНІСТЬ"
  supporting:
    - "ОДНА ІДЕЯ."
    - "ОДИН СИГНАЛ."
hard_exclusions:
  - "no portrait layout"
  - "no pixel, bitmap, dot-matrix, or segmented font"
  - "no UI mockup chrome"
  - "no decorative coordinates or random dotted grids"
  - "no gradients, shadows, glossy surfaces, or 3D"
  - "no Soviet symbols or revolutionary poster styling"
  - "no accidental labels, logos, footers, or extra text"
output:
  format: PNG
  exact_size: 1920x1080
  text_accuracy: publish-ready
