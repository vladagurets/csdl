  signal_primary: "muted mineral coral #C96157"
  signal_data: "dusty data blue #4C6A8A"
  signal_attention: "soft ochre #C4A25D"
global_constraints:
  - compose directly for 16:9 landscape
  - one main idea, one visual mechanism, one dominant Signal
  - 50–75 percent negative space according to expression level
