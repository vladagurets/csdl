name: Validate CSDL

on:
  pull_request:
  push:
    branches: [main, pilot-01]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate Pilot 01 manifest
        run: python tools/validate_manifest.py pilots/01-agentic-discipline/manifest.yaml
      - name: Validate Pilot 01 style anchor
        run: >-
          python tools/validate_style_anchor.py
          pilots/01-agentic-discipline/references/style-anchor-light.png
      - name: Validate existing Pilot 01 canonical assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.validate_assets import validate_assets

          errors = validate_assets(
              Path('pilots/01-agentic-discipline'),
              require_complete=False,
          )
          if errors:
              raise SystemExit('\n'.join(f'ERROR: {error}' for error in errors))
          print('existing assets valid')
          PY

  diagnose-exact-card-01:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/finish-task-5-exact-v1'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-task-5-exact-v1
          fetch-depth: 0

      - name: Capture Debian 13 renderer diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/render-card01.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          output = Path('/work/pilots/01-agentic-discipline/canonical/light/4x5/01-hook.png')
          output.parent.mkdir(parents=True, exist_ok=True)
          image = Image.new('RGB', (1080, 1350), '#F7F5F0')
          draw = ImageDraw.Draw(image)
          headline = ImageFont.truetype('/usr/share/fonts/opentype/inter/InterDisplay-Black.otf', 96)
          body = ImageFont.truetype('/usr/share/fonts/opentype/inter/Inter-Regular.otf', 38)
          for position, text in [
              ((72, 70), 'СИЛЬНИЙ'),
              ((104, 157), 'АГЕНТ ≠'),
              ((80, 286), 'СТІЙКИЙ'),
              ((130, 374), 'РЕЗУЛЬТАТ'),
          ]:
              draw.text(position, text, font=headline, fill='#1B1B19')
          draw.text((72, 627), 'Стабільність з’являється, коли робота має', font=body, fill='#535457')
          draw.text((72, 678), 'процес, перевірки й пам’ять.', font=body, fill='#535457')
          draw.line((540, 790, 820, 965), fill='#1B1B19', width=3)
          draw.rectangle((820, 965, 1009, 1154), fill='#C96157')
          image.save(output, format='PNG', optimize=True, compress_level=9)
          PY

          docker run --rm \
            -v "$PWD:/work" \
            -v /tmp/render-card01.py:/tmp/render-card01.py:ro \
            -w /work \
            debian:trixie-slim \
            bash -lc '
              exec > /work/task5-exact-diagnostic.txt 2>&1
              set -x
              cat /etc/os-release
              apt-get update
              apt-get install -y --no-install-recommends python3 python3-venv fonts-inter ca-certificates
              sha256sum /usr/share/fonts/opentype/inter/InterDisplay-Black.otf
              sha256sum /usr/share/fonts/opentype/inter/Inter-Regular.otf
              python3 --version
              python3 -m venv /tmp/venv
              /tmp/venv/bin/pip install --no-cache-dir Pillow==12.2.0
              /tmp/venv/bin/python -c "import PIL; from PIL import features; print(\"Pillow\", PIL.__version__); print(\"FreeType\", features.version(\"freetype2\")); print(\"zlib\", features.version(\"zlib\"))"
              /tmp/venv/bin/python /tmp/render-card01.py
              sha256sum /work/pilots/01-agentic-discipline/canonical/light/4x5/01-hook.png
              stat -c "%s bytes" /work/pilots/01-agentic-discipline/canonical/light/4x5/01-hook.png
            ' || true

      - name: Upload renderer diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: task5-exact-renderer-diagnostic
          path: |
            task5-exact-diagnostic.txt
            pilots/01-agentic-discipline/canonical/light/4x5/01-hook.png
          if-no-files-found: error
