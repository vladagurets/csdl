name: Validate CSDL

on:
  pull_request:
  push:
    branches: [main, pilot-01]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate Pilot 01 manifest
        run: python tools/validate_manifest.py pilots/01-agentic-discipline/manifest.yaml
