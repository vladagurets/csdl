id: '006'
slug: collision
name: Collision
version: 0.5.0
source_family: collision
problem: Show two forces producing one consequential intersection or synthesis.
allowed_scenarios:
- constraint
- synthesis
- tension
- trade-off
ingredients:
  required:
  - component: Anchor
    min: 2
    max: 2
    default: 2
  - component: Collision
    min: 1
    max: 1
    default: 1
  - component: Signal
    min: 1
    max: 1
    default: 1
  optional:
  - component: Label
    min: 0
    max: 3
    default: 0
relations:
  allowed:
  - subject: Collision
    type: overlaps
    object: Anchor
  - subject: Collision
    type: produces
    object: Signal
  forbidden:
  - subject: Collision
    type: groups
    object: Anchor
assembly_order:
- place two opposing Anchors
- create one functional overlap
- label the result
