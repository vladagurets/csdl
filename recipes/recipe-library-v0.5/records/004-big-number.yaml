id: '004'
slug: big-number
name: Big Number
version: 0.5.0
source_family: big-number
problem: Make one exact quantity the dominant explanatory object.
allowed_scenarios:
- count
- percentage
- ratio
- milestone
ingredients:
  required:
  - component: Anchor
    min: 1
    max: 1
    default: 1
  - component: Pulse
    min: 1
    max: 1
    default: 1
  - component: Label
    min: 1
    max: 2
    default: 1
  - component: Signal
    min: 1
    max: 1
    default: 1
  optional: []
relations:
  allowed:
  - subject: Label
    type: attached_to
    object: Pulse
  - subject: Signal
    type: highlights
    object: Pulse
  forbidden:
  - subject: Pulse
    type: directs
    object: Anchor
assembly_order:
- place Pulse
- attach concise label
- add one supporting line and one Signal
expression_levels:
  A:
    status: allowed
  B:
    status: allowed
  C:
    status: allowed
compatible_visual_dna_families:
- big-number
presentation:
  canvas: 1920x1080
  orientation: landscape
  safe_margin_horizontal: 96
  safe_margin_vertical: 72
  negative_space_percent:
    min: 50
    max: 75
  reading_paths:
  - left_to_right
  presentation_readability: 1280x720 without zoom
typography:
  display: modular_technical
  body: neutral_sans
  code: technical_mono
  constraints:
  - all text horizontal by default
  - maximum one typographic trick
  - Ukrainian and English copy exact
semantic_color:
  dominant_signal: coral
  allowed:
  - coral
  constraints:
  - one dominant signal
  - signal area at most 8 percent
  - color is not the only carrier of meaning
content_contract:
  required:
  - value
  - label
  - supporting_copy
  optional: []
  exact: true
  max_words: 60
  data_contract: none
prompt_dsl:
  semantic_intent: big-number-mechanism
  required_fields:
  - semantic_intent
  - content
  - component_instances
  - relations
  - generation_constraints
  - provenance
  optional_fields:
  - component_instances[].attributes
  - provenance.source_prompt
  - provenance.dataset
  deterministic_defaults:
    expression: A
    density: low
    reading_path: left_to_right
hard_exclusions:
- extra text
- logos or repeated footers
- UI chrome or decorative card shells
- decorative coordinates or random dot fields
- gradients, shadows, glossy surfaces, or 3D
- political, Soviet, or revolutionary-poster styling
- pixel, bitmap, dot-matrix, segmented, or retro-computer lettering
- extra metric
- unsupported statistic
- gauge
- donut
- fake trend
- decorative digits
- UI chrome
- logo
- footer
- gradients
- shadows
- 3D
- Container or ad hoc layout and geometry primitives
validation_invariants:
- Every required content binding is present and exact.
- Ingredient counts remain inside declared cardinality.
- Every instance and relation is permitted by Component Library v0.1.
- No undeclared layout or geometry terminology is present.
- One main idea, one visual mechanism, and one dominant Signal remain observable.
canonical_examples:
- path: patterns/visual-dna-sprint-01/canonical/light/16x9/3.png
  role: accepted visual calibration
evidence:
