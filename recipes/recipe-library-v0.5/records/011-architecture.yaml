id: '011'
slug: architecture
name: Architecture
version: 0.5.0
source_family: architecture
problem: Explain stable system boundaries and permitted interactions.
allowed_scenarios:
- software context
- agent system
- service boundary
ingredients:
  required:
  - component: Field
    min: 1
    max: 2
    default: 1
  - component: Node
    min: 2
    max: 7
    default: 4
  - component: Bridge
    min: 1
    max: 4
    default: 3
  - component: Label
    min: 2
    max: 7
    default: 4
  optional: []
relations:
  allowed:
  - subject: Field
    type: contains
    object: Node
  - subject: Bridge
    type: connected_to
    object: Node
  - subject: Label
    type: attached_to
    object: Node
  forbidden:
  - subject: Bridge
    type: orders
    object: Node
assembly_order:
- define system Field
- place bounded Nodes
- connect only permitted relations
- emphasize one boundary
expression_levels:
  A:
    status: allowed
  B:
    status: allowed
  C:
    status: forbidden
    reason: No accepted evidence supports this recipe at the expression level.
compatible_visual_dna_families:
- architecture
presentation:
  canvas: 1920x1080
  orientation: landscape
  safe_margin_horizontal: 96
  safe_margin_vertical: 72
  negative_space_percent:
    min: 50
    max: 75
  reading_paths:
  - outside_to_inside
  - center_out
  presentation_readability: 1280x720 without zoom
typography:
  display: modular_technical
  body: neutral_sans
  code: technical_mono
  constraints:
  - all text horizontal by default
  - maximum one typographic trick
  - Ukrainian and English copy exact
semantic_color:
  dominant_signal: data_blue
  allowed:
  - data_blue
  constraints:
  - one dominant signal
  - signal area at most 10 percent
  - color is not the only carrier of meaning
content_contract:
  required:
  - headline
  - nodes
  - relations
  optional: []
  exact: true
  max_words: 60
  data_contract: none
prompt_dsl:
  semantic_intent: architecture-mechanism
  required_fields:
  - semantic_intent
  - content
  - component_instances
  - relations
  - generation_constraints
  - provenance
  optional_fields:
  - component_instances[].attributes
  - provenance.source_prompt
  - provenance.dataset
  deterministic_defaults:
    expression: B
    density: medium
    reading_path: outside_to_inside
hard_exclusions:
- extra text
- logos or repeated footers
- UI chrome or decorative card shells
- decorative coordinates or random dot fields
- gradients, shadows, glossy surfaces, or 3D
- political, Soviet, or revolutionary-poster styling
- pixel, bitmap, dot-matrix, segmented, or retro-computer lettering
- cloud icons
- server racks
- code windows
- dashboard cards
- unlabeled connectors
- decorative network nodes
- gradients
- shadows
- 3D
- Container or ad hoc layout and geometry primitives
validation_invariants:
- Every required content binding is present and exact.
- Ingredient counts remain inside declared cardinality.
- Every instance and relation is permitted by Component Library v0.1.
- No undeclared layout or geometry terminology is present.
- One main idea, one visual mechanism, and one dominant Signal remain observable.
canonical_examples:
- path: patterns/visual-dna-sprint-01/canonical/light/16x9/9.png
  role: accepted visual calibration
evidence:
- path: patterns/visual-dna-sprint-01/manifest.yaml
  locator: family 11 Architecture
  supports: Problem, scenarios, components, assembly, levels, content, and exclusions.
- path: patterns/visual-dna-sprint-01/specs/11-architecture.md
  locator: complete family contract
  supports: Canonical Markdown semantic and Prompt DSL evidence.
- path: patterns/visual-dna-sprint-01/canonical/light/16x9/9.png
  locator: canonical raster
  supports: Accepted presentation-scale example.
compatibility:
  legacy_names:
  - Architecture
  migration: Legacy Prompt DSL v0.1 content is rebound mechanically to explicit v0.5
    instances, relations, and deterministic constraints; source files remain unchanged.
  rollback: Revert the additive recipe record and derived outputs; accepted source
    prompts and raster bytes remain unchanged.
specification: specs/011-architecture.md
record: records/011-architecture.yaml
