id: '007'
slug: before-after
name: Before / After
version: 0.5.0
source_family: before-after
problem: Make a state change legible without reducing it to cosmetic restyling.
allowed_scenarios:
- transformation
- migration
- improvement
ingredients:
  required:
  - component: Field
    min: 2
    max: 2
    default: 2
  - component: Divider
    min: 1
    max: 1
    default: 1
  - component: Vector
    min: 1
    max: 1
    default: 1
  - component: Signal
    min: 1
    max: 1
    default: 1
  optional: []
relations:
  allowed:
  - subject: Divider
    type: separates
    object: Field
  - subject: Vector
    type: directs
    object: Field
  - subject: Signal
    type: highlights
    object: Field
  forbidden:
  - subject: Divider
    type: directs
    object: Field
assembly_order:
- define before Field
- define after Field
- connect with one Vector
- signal changed property
expression_levels:
  A:
    status: allowed
  B:
    status: allowed
  C:
    status: forbidden
    reason: No accepted evidence supports this recipe at the expression level.
compatible_visual_dna_families:
- before-after
presentation:
  canvas: 1920x1080
  orientation: landscape
  safe_margin_horizontal: 96
  safe_margin_vertical: 72
  negative_space_percent:
    min: 50
    max: 75
  reading_paths:
  - left_to_right
  presentation_readability: 1280x720 without zoom
typography:
  display: modular_technical
  body: neutral_sans
  code: technical_mono
  constraints:
  - all text horizontal by default
  - maximum one typographic trick
  - Ukrainian and English copy exact
semantic_color:
  dominant_signal: mineral_green
  allowed:
  - mineral_green
  constraints:
  - one dominant signal
  - signal area at most 8 percent
  - color is not the only carrier of meaning
content_contract:
  required:
  - headline
  - before
  - after
  optional: []
  exact: true
  max_words: 60
  data_contract: none
prompt_dsl:
  semantic_intent: before-after-mechanism
  required_fields:
  - semantic_intent
  - content
  - component_instances
  - relations
  - generation_constraints
  - provenance
  optional_fields:
  - component_instances[].attributes
  - provenance.source_prompt
  - provenance.dataset
  deterministic_defaults:
    expression: A
    density: low
    reading_path: left_to_right
hard_exclusions:
- extra text
- logos or repeated footers
- UI chrome or decorative card shells
- decorative coordinates or random dot fields
- gradients, shadows, glossy surfaces, or 3D
- political, Soviet, or revolutionary-poster styling
- pixel, bitmap, dot-matrix, segmented, or retro-computer lettering
- node field
- network
- process map
- circles
- squares
- triangles
- makeover imagery
- check or cross icons
- decorative split screen
- UI chrome
- logo
- footer
- gradients
- shadows
- 3D
- Container or ad hoc layout and geometry primitives
validation_invariants:
- Every required content binding is present and exact.
- Ingredient counts remain inside declared cardinality.
- Every instance and relation is permitted by Component Library v0.1.
- No undeclared layout or geometry terminology is present.
- One main idea, one visual mechanism, and one dominant Signal remain observable.
canonical_examples:
- path: patterns/visual-dna-sprint-01/canonical/light/16x9/07-before-after.png
  role: accepted visual calibration
evidence:
- path: patterns/visual-dna-sprint-01/manifest.yaml
  locator: family 07 Before / After
  supports: Problem, scenarios, components, assembly, levels, content, and exclusions.
- path: patterns/visual-dna-sprint-01/specs/07-before-after.md
  locator: complete family contract
  supports: Canonical Markdown semantic and Prompt DSL evidence.
- path: patterns/visual-dna-sprint-01/canonical/light/16x9/07-before-after.png
  locator: canonical raster
  supports: Accepted presentation-scale example.
compatibility:
  legacy_names:
  - Before / After
  migration: Legacy Prompt DSL v0.1 content is rebound mechanically to explicit v0.5
    instances, relations, and deterministic constraints; source files remain unchanged.
  rollback: Revert the additive recipe record and derived outputs; accepted source
    prompts and raster bytes remain unchanged.
specification: specs/007-before-after.md
record: records/007-before-after.yaml
