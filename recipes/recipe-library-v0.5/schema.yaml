required_ingredient_groups: [required, optional]
required_ingredient_fields: [component, min, max, default]
required_relation_groups: [allowed, forbidden]
required_relation_fields: [subject, type, object]
required_expression_levels: [A, B, C]
required_expression_fields: [status]
required_presentation_fields:
  - canvas
  - orientation
  - safe_margin_horizontal
  - safe_margin_vertical
  - negative_space_percent
  - reading_paths
  - presentation_readability
required_typography_fields: [display, body, code, constraints]
required_semantic_color_fields: [dominant_signal, allowed, constraints]
required_content_contract_fields: [required, optional, exact, max_words, data_contract]
required_prompt_dsl_fields:
  - semantic_intent
  - required_fields
  - optional_fields
  - deterministic_defaults
required_evidence_fields: [path, locator, supports]
required_compatibility_fields: [legacy_names, migration, rollback]
required_migration_fields:
  - id
  - source_versions
  - target_version
  - source_files
  - recipe_map
  - reference_only
  - normalization_rules

required_spec_sections:
  - "## Problem"
  - "## Allowed scenarios"
  - "## Ingredients and cardinality"
  - "## Allowed relations"
  - "## Forbidden relations"
  - "## Assembly order"
  - "## Expression levels"
  - "## Compatible Visual DNA families"
  - "## Canvas and presentation constraints"
  - "## Negative space, typography, and semantic color"
  - "## Content contract"
  - "## Prompt DSL v0.5"
  - "## Deterministic defaults"
  - "## Hard exclusions"
  - "## Validation invariants"
  - "## Canonical examples and evidence"
  - "## Compatibility and rollback"

enums:
  expression_status: [allowed, conditional, forbidden]
  density: [low, medium, analytical]
  signal: [coral, data_blue, ochre, mineral_green]
  relation_cardinality: [one, zero_or_one, one_or_many, zero_or_many]

path_rules:
  specification: "specs/{id}-{slug}.md"
  record: "records/{id}-{slug}.yaml"

forbidden_composition_keys:
  - layout
  - geometry
  - shape
  - plane
  - line
  - box
  - card
  - panel
  - grid
  - row
  - column
  - left
  - right
  - top
  - bottom
  - position
  - coordinates
  - container

forbidden_placeholders: [TBD, TODO, TBC, FIXME, placeholder]
